# Bulwark environment overlay for ras-backend (https://submissions.gcp.dev.bulwark.health).
# Activated at deploy time with SPRING_PROFILES_ACTIVE=bundled,bulwark.
#
# Pool: us-east-2_iobajgtWs — the LIVE pool managed by ras-api/infra terraform
# (hosted UI rasapp.auth.us-east-2.amazoncognito.com). The pool this overlay used
# to name, us-east-2_LnQ3AM9Y7, was deleted: cognito-idp returns 404 for it and
# its `ras` hosted-UI domain no longer resolves. Both Cognito locations the
# backend reads (authz.cognito.* for group/claim handling, and the resource-server
# issuer/JWKS for token validation) must name the same pool as the UI, or
# UI-issued tokens fail validation.
authz:
  cors:
    allowed-origins: https://submissions.gcp.dev.bulwark.health, http://localhost:4200
  cognito:
    user-pool-id: us-east-2_iobajgtWs
    client-id: 7ov1h3tml7t3ah6t1kn0h7ekci
    region: us-east-2
spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://cognito-idp.us-east-2.amazonaws.com/us-east-2_iobajgtWs
          jwk-set-uri: https://cognito-idp.us-east-2.amazonaws.com/us-east-2_iobajgtWs/.well-known/jwks.json
